name: Validate Repository
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  validate:
    name: Check repository files
    runs-on: ubuntu-latest
 
    steps:
      - name: Download repository code
        uses: actions/checkout@v4
 
      - name: Verify README exists
        run: test -f README.md
 
      - name: Verify favicon exists
        run: test -f favicon.png
 
      - name: Report success
        run: echo "Repository validation passed."
